#
# Squid minimum configuration for Dev Container sandbox
#

http_port 3128

#
# 許可するポート
#

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports


#
# 内部ネットワークへのアクセス禁止
#
# Proxyを踏み台にしてホスト/LANへアクセスされることを防ぐ
#

acl private_network dst 10.0.0.0/8
acl private_network dst 172.16.0.0/12
acl private_network dst 192.168.0.0/16
acl private_network dst 127.0.0.0/8
acl private_network dst 169.254.0.0/16

http_access deny private_network




#
# Allowlist
#
include /etc/squid/allowlist.conf
http_access allow allowed_domains

#
# その他はすべて拒否
#

http_access deny all


#
# キャッシュは今回不要
#

cache_mem 0 MB
cache deny all
cache_dir null /tmp


#
# ログ
#

access_log stdio:/var/log/squid/access.log